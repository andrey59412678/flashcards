id: flashcards
host_kind: pm2_process
purpose: "Estudo pessoal para autoescola: flashcards de placas e simulado da prova teórica com o Banco Nacional de Questões oficial, interface mobile."
tags: [personal, study, flashcards, simulado, autoescola, mobile]
url: https://flashcards.apps.home.arpa
ports: [47865]
requires_https: true
runbook: |
  Repo: /home/andrey/projects/personal/flashcards.
  Node + TypeScript, PM2 flashcards, bind 127.0.0.1:47865.
  HTTPS e SSO pelo Personal Auth no perfil gateway-origin.
  Build: npm run build. Deploy: pm2 startOrReload ecosystem.config.cjs --only flashcards --update-env.
  Espelho publico sem SSO em https://andrey59412678.github.io/flashcards/, para quem esta fora do tailnet.
  Repo publico github.com/andrey59412678/flashcards; push na main dispara .github/workflows/pages.yml, que roda npm test e publica public/.
  Os assets resolvem por import.meta.url, entao o mesmo public/ serve na raiz local e no subpath do Pages.
  Deck inicial: public/decks.json, 86 placas das imagens de referencia (55 advertencia, 31 regulamentacao).
  Imagens originais em public/assets; o SVG recorta apenas o simbolo em cada cartao.
  Progresso e ordem ficam no localStorage do navegador, chave flashcards.session.v1; nenhum banco no servidor.
  Novos cards aceitam prompt e answer em texto, image opcional; novos decks aparecem no seletor.
  Simulado em simulado.html (logica pura em exam.js): 30 questoes sorteadas por modulo, 60 min, minimo 20 acertos
  (Resolucao CONTRAN 1.020/2025), correcao so no fim, alternativas embaralhadas por tentativa e treino dos erros.
  Banco em public/questions.json, gerado do Banco Nacional de Questoes v1.0 (Senatran, dez/2025) por
  node scripts/import-bnq.mjs bnq.txt (texto de pdftotext -layout do PDF oficial); remove questoes
  identicas (texto+placa+resposta). Placas reaproveitam os recortes de decks.json pelo sourceCode; as que faltam
  vem de SVGs do Wikimedia Commons em public/assets/signs (mapa SIGN_FILES no script, creditos em CREDITOS.txt).
  O banco imprime R-35/R-44 para o que o manual CONTRAN chama R-36b/R-36c; o arquivo segue a resposta da questao.
  Prova, erros e historico ficam no localStorage: simulado.attempt.v1, simulado.missed.v1, simulado.history.v1.
  Códigos sourceCode preservam a fonte e não são exibidos; última linha da imagem de advertência contém códigos repetidos.
commands:
  health:
    check: "curl -fsS http://127.0.0.1:47865/health"
  restart:
    run: "pm2 restart flashcards"
agent_instructions: |
  Use npm. Valide npm test, npm run typecheck e npm run build antes do restart da propria tool.
  Preserve imagens e significado de cada card; nao gere simbolos de transito com IA.
  Nao edite questions.json a mao nem gere questoes com IA; regenere pelo script a partir do banco oficial.
  Para acrescentar assunto, edite public/decks.json com um deck de id unico e cards com id, prompt, answer e image opcional.
  A resposta deve estar ausente da frente e voltar escondida ao avancar, voltar, embaralhar ou recarregar.
  Mantenha bind loopback e a rota SSO em /home/andrey/projects/personal-auth/config/apps.json.
